name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run ty check src/gandi_mcp/
      - run: uv run bandit -r src/gandi_mcp/ -c pyproject.toml

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
          cache-suffix: py${{ matrix.python }}
      - run: uv sync --extra dev
      - run: uv run pytest -m "not live" --cov=gandi_mcp --cov-report=xml --cov-report=json --cov-report=term --cov-fail-under=90
      - run: uv run python scripts/check_coverage_thresholds.py
      - name: Cassette staleness warning (non-blocking)
        if: always()
        run: |
          if ! make check-cassettes-fresh; then
            echo "::warning::Some cassettes are >180 days old. Run 'make refresh-cassettes' locally."
          fi
      - if: matrix.python == '3.13'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - run: uv sync --extra dev
      - run: uv run pip-audit
      - run: pipx run zizmor==1.24.1 .github/workflows/
